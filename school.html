<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدرسة النخبة العلمية - نظام الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --primary:#0f3a6b;
  --primary-2:#1e5fa8;
  --accent:#f6b93b;
  --accent-2:#e58e26;
  --bg:#eef3fb;
  --card:#ffffff;
  --text:#1b2a4e;
  --muted:#6b7a99;
  --success:#16a34a;
  --success-light:#dcfce7;
  --danger:#dc2626;
  --danger-light:#fee2e2;
  --warning:#d97706;
  --border:#dbe3f0;
  --shadow:0 6px 24px rgba(15,58,107,0.08);
  --shadow-hover:0 10px 32px rgba(15,58,107,0.15);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal',Tahoma,Arial,sans-serif;}
html,body{height:100%;}
body{background:linear-gradient(135deg,#eef3fb 0%,#dde7f6 100%);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}

/* Header */
.app-header{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-2) 100%);color:#fff;padding:14px 28px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 18px rgba(0,0,0,0.12);position:sticky;top:0;z-index:50;}
.app-header .left{display:flex;align-items:center;gap:14px;}
.app-header .breadcrumb{font-size:0.95rem;opacity:0.9;background:rgba(255,255,255,0.12);padding:6px 14px;border-radius:20px;}
.app-header .school-brand{display:flex;align-items:center;gap:10px;}
.app-header .school-brand .logo{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.2rem;}
.app-header .school-brand .name{font-size:1.45rem;font-weight:900;letter-spacing:0.5px;}
.app-header .school-brand .name small{display:block;font-size:0.7rem;font-weight:500;opacity:0.9;}

/* Main */
.main{flex:1;padding:28px;max-width:1400px;margin:0 auto;width:100%;}
.view-title{font-size:1.7rem;font-weight:900;color:var(--primary);margin-bottom:6px;display:flex;align-items:center;gap:10px;}
.view-title .icon{font-size:1.5rem;}
.view-subtitle{color:var(--muted);margin-bottom:24px;font-size:0.95rem;}

/* Cards / Grid */
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;}
.menu-card{background:var(--card);border-radius:18px;padding:28px 22px;box-shadow:var(--shadow);cursor:pointer;transition:all .25s;border:2px solid transparent;text-align:center;}
.menu-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-hover);border-color:var(--primary-2);}
.menu-card .icon-circle{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:1.8rem;}
.menu-card.accent .icon-circle{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--primary);}
.menu-card.success .icon-circle{background:linear-gradient(135deg,#16a34a,#22c55e);}
.menu-card.danger .icon-circle{background:linear-gradient(135deg,#dc2626,#ef4444);}
.menu-card h3{font-size:1.15rem;font-weight:700;margin-bottom:6px;}
.menu-card p{color:var(--muted);font-size:0.88rem;}

/* Card */
.card{background:var(--card);border-radius:16px;padding:24px;box-shadow:var(--shadow);margin-bottom:20px;}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.card-header h2{font-size:1.25rem;color:var(--primary);font-weight:700;}

/* Form */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;}
.form-group{display:flex;flex-direction:column;gap:6px;}
.form-group label{font-weight:600;font-size:0.92rem;color:var(--primary);}
.form-group input,.form-group select,.form-group textarea{padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:1rem;background:#fff;transition:border-color .2s;font-family:inherit;color:var(--text);}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary-2);box-shadow:0 0 0 3px rgba(30,95,168,0.15);}
.form-group .hint{font-size:0.78rem;color:var(--muted);}
.day-picker{display:flex;flex-wrap:wrap;gap:8px;}
.day-picker label{display:flex;align-items:center;gap:6px;background:#f4f7fc;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:0.9rem;border:1.5px solid var(--border);transition:all .15s;}
.day-picker label:hover{border-color:var(--primary-2);}
.day-picker input{display:none;}
.day-picker label.checked{background:var(--primary-2);color:#fff;border-color:var(--primary-2);}

/* Buttons */
.btn{padding:11px 22px;border:none;border-radius:10px;cursor:pointer;font-size:0.98rem;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;font-family:inherit;text-decoration:none;}
.btn:hover{transform:translateY(-1px);}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 4px 14px rgba(15,58,107,0.25);}
.btn-primary:hover{box-shadow:0 6px 20px rgba(15,58,107,0.35);}
.btn-accent{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--primary);box-shadow:0 4px 14px rgba(229,142,38,0.25);}
.btn-success{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;}
.btn-danger{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;}
.btn-ghost{background:#f4f7fc;color:var(--primary);border:1.5px solid var(--border);}
.btn-ghost:hover{background:#e6edf8;}
.btn-sm{padding:7px 13px;font-size:0.85rem;}
.btn-block{width:100%;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}

/* Table */
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border);}
table{width:100%;border-collapse:collapse;background:#fff;}
th{background:#f4f7fc;padding:12px 14px;text-align:right;font-weight:700;color:var(--primary);font-size:0.92rem;border-bottom:2px solid var(--border);white-space:nowrap;}
td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:0.94rem;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#fafbfd;}
tr.row-danger td{background:var(--danger-light)!important;}
tr.row-success td{background:var(--success-light)!important;}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
.empty-state .ico{font-size:3rem;margin-bottom:10px;opacity:0.5;}

/* Badges */
.badge{display:inline-block;padding:4px 10px;border-radius:14px;font-size:0.78rem;font-weight:600;}
.badge-blue{background:#dbeafe;color:#1e40af;}
.badge-green{background:#dcfce7;color:#166534;}
.badge-red{background:#fee2e2;color:#991b1b;}
.badge-amber{background:#fef3c7;color:#92400e;}
.badge-purple{background:#ede9fe;color:#5b21b6;}
.badge-gray{background:#e5e7eb;color:#374151;}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px;}
.stat-card{background:#fff;border-radius:12px;padding:18px;box-shadow:var(--shadow);text-align:right;border-right:4px solid var(--primary-2);}
.stat-card .label{color:var(--muted);font-size:0.85rem;margin-bottom:4px;}
.stat-card .value{font-size:1.6rem;font-weight:900;color:var(--primary);}
.stat-card.success{border-right-color:var(--success);}
.stat-card.success .value{color:var(--success);}
.stat-card.danger{border-right-color:var(--danger);}
.stat-card.danger .value{color:var(--danger);}
.stat-card.accent{border-right-color:var(--accent-2);}
.stat-card.accent .value{color:var(--accent-2);}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,42,78,0.6);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px);}
.modal-overlay.show{display:flex;}
.modal{background:#fff;border-radius:16px;padding:26px;max-width:520px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.3);max-height:90vh;overflow:auto;}
.modal h3{color:var(--primary);margin-bottom:14px;font-size:1.25rem;}
.modal p{margin-bottom:18px;color:var(--text);line-height:1.6;}

/* Toast */
.toast-container{position:fixed;top:80px;left:20px;z-index:200;display:flex;flex-direction:column;gap:10px;}
.toast{background:#fff;border-right:4px solid var(--primary-2);padding:14px 20px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.15);min-width:280px;animation:slideIn .25s;}
.toast.success{border-right-color:var(--success);}
.toast.error{border-right-color:var(--danger);}
.toast.warning{border-right-color:var(--warning);}
@keyframes slideIn{from{transform:translateX(-100%);opacity:0;}to{transform:translateX(0);opacity:1;}}

/* Search */
.search-bar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.search-bar input,.search-bar select{padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;flex:1;min-width:200px;font-family:inherit;font-size:0.95rem;}

/* Footer */
.app-footer{background:var(--primary);color:#fff;padding:14px 28px;text-align:center;font-size:0.92rem;letter-spacing:0.5px;}
.app-footer .designer{font-weight:700;color:var(--accent);}

/* Floating back button */
.floating-back{position:fixed;bottom:70px;left:24px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--primary);border:none;padding:14px 22px;border-radius:30px;cursor:pointer;font-weight:700;font-size:1rem;box-shadow:0 8px 28px rgba(229,142,38,0.45);z-index:40;display:none;font-family:inherit;}
.floating-back:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(229,142,38,0.55);}
.floating-back.show{display:inline-flex;align-items:center;gap:8px;}

/* Notification badge */
.notif-pill{display:inline-flex;align-items:center;gap:6px;background:var(--danger);color:#fff;padding:4px 10px;border-radius:14px;font-size:0.78rem;font-weight:700;margin-right:6px;}

/* Receipt list */
.receipt-list{display:flex;flex-wrap:wrap;gap:6px;}
.receipt-chip{background:#f4f7fc;border:1px solid var(--border);padding:4px 10px;border-radius:8px;font-size:0.82rem;display:inline-flex;gap:4px;align-items:center;}

/* Invoice */
.invoice{background:#fff;border:2px solid var(--primary);border-radius:14px;padding:26px;margin-bottom:18px;}
.invoice-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;border-bottom:2px dashed var(--border);padding-bottom:14px;}
.invoice-header h2{color:var(--primary);font-size:1.4rem;}
.invoice-meta{font-size:0.9rem;color:var(--muted);}
.invoice-rows{margin:14px 0;}
.invoice-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dotted var(--border);}
.invoice-row.total{border-top:2px solid var(--primary);border-bottom:none;margin-top:10px;padding-top:12px;font-weight:900;color:var(--primary);font-size:1.1rem;}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:18px;flex-wrap:wrap;}
.tab{padding:10px 18px;cursor:pointer;border:none;background:none;font-family:inherit;font-size:0.95rem;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);}

/* Helpers */
.flex{display:flex;}.gap-1{gap:8px;}.gap-2{gap:14px;}.mt-1{margin-top:10px;}.mt-2{margin-top:18px;}.mb-2{margin-bottom:18px;}
.text-muted{color:var(--muted);}.text-success{color:var(--success);}.text-danger{color:var(--danger);}.text-center{text-align:center;}
.fw-bold{font-weight:700;}
.actions-cell{display:flex;gap:6px;justify-content:flex-start;}

/* Print */
@media print{
  .app-header,.app-footer,.floating-back,.no-print{display:none!important;}
  body{background:#fff;}
  .main{padding:0;}
}

/* Responsive */
@media(max-width:768px){
  .app-header{padding:12px 16px;}
  .app-header .school-brand .name{font-size:1.1rem;}
  .app-header .breadcrumb{display:none;}
  .main{padding:18px 14px;}
  .view-title{font-size:1.3rem;}
  .menu-card{padding:22px 16px;}
  .stat-card .value{font-size:1.3rem;}
  .floating-back{bottom:60px;left:14px;padding:11px 18px;font-size:0.9rem;}
  th,td{padding:9px 10px;font-size:0.85rem;}
}
</style>
</head>
<body>

<header class="app-header">
  <div class="school-brand">
    <div class="logo">ن</div>
    <div>
      <div class="name">مدرسة النخبة <small>العلمية</small></div>
    </div>
  </div>
  <div class="left">
    <span id="breadcrumb" class="breadcrumb">القائمة الرئيسية</span>
    <button id="notifBtn" class="btn btn-ghost btn-sm" onclick="showView('notifications')" style="background:rgba(255,255,255,0.15);color:#fff;border-color:transparent;">
      🔔 الإشعارات <span id="notifCount" class="notif-pill" style="display:none;">0</span>
    </button>
  </div>
</header>

<main class="main">
  <div id="viewContainer"></div>
</main>

<button class="floating-back" id="floatBack" onclick="goHome()">⌂ العودة للقائمة الرئيسية</button>

<footer class="app-footer">
  <span class="designer">Designed by BELKHIRI ILYES</span>
</footer>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modalTitle">تأكيد</h3>
    <p id="modalBody">هل أنت متأكد؟</p>
    <div class="btn-row" style="justify-content:flex-end;">
      <button class="btn btn-ghost" onclick="closeModal(false)">إلغاء</button>
      <button class="btn btn-primary" id="modalOk" onclick="closeModal(true)">تأكيد</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
/* ============================================================
   مدرسة النخبة العلمية - نظام إدارة المدرسة
   ============================================================ */

// ---------- Storage / State ----------
const STORAGE_KEY = 'nokhba_school_data_v1';

const DEFAULT_STATE = {
  teachers: [],
  expenses: [],
  monthlyReports: [],
  annualReports: [],
  archive: [],
  schoolYearStart: new Date().toISOString().slice(0,10),
  settings: {
    prices: { normal:2000, special:6000, review:4000, individual:30000 },
    teacherShare: 2/3,
    schoolShare: 1/3,
    pagePrice: 5
  }
};

let state = loadState();
let currentView = 'menu';
let navContext = {}; // ephemeral context for navigation

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
    const parsed = JSON.parse(raw);
    return Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), parsed);
  }catch(e){
    console.error(e);
    return JSON.parse(JSON.stringify(DEFAULT_STATE));
  }
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
window.addEventListener('beforeunload', saveState);

// ---------- Utilities ----------
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function fmtNum(n){ return Number(n||0).toLocaleString('ar-DZ'); }
function fmtMoney(n){ return fmtNum(Math.round(n||0)) + ' دج'; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function parseDate(s){ return s ? new Date(s) : new Date(); }
function daysBetween(a,b){ return Math.floor((b - a) / (1000*60*60*24)); }
function currentMonthKey(d){
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function monthKeyFromDate(s){
  const d = new Date(s);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function arabicMonthName(key){
  const months = ['جانفي','فيفري','مارس','أفريل','ماي','جوان','جويلية','أوت','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const [y,m] = key.split('-');
  return months[parseInt(m)-1] + ' ' + y;
}
function groupTypeLabel(t){
  return {normal:'عادي', special:'خاص', review:'مراجعة', individual:'انديفيديال'}[t] || t;
}
function groupTypePrice(t){ return state.settings.prices[t] || 0; }

// ---------- Toast / Modal ----------
function toast(msg, type='success'){
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = (type==='success'?'✓ ':type==='error'?'✕ ':type==='warning'?'⚠ ':'')+msg;
  c.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateX(-100%)'; setTimeout(()=>t.remove(),250); }, 2800);
}
let modalResolve = null;
function confirmModal(title, body, okText='تأكيد'){
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalOk').textContent = okText;
  document.getElementById('modal').classList.add('show');
  return new Promise(res => { modalResolve = res; });
}
function closeModal(ok){
  document.getElementById('modal').classList.remove('show');
  if(modalResolve){ modalResolve(ok); modalResolve = null; }
}

// ---------- Router ----------
const breadcrumbs = {
  menu: 'القائمة الرئيسية',
  addTeacher: 'إضافة أستاذ',
  addGroup: 'إضافة فوج',
  addStudents: 'إضافة تلاميذ للفوج',
  teachersList: 'قائمة الأساتذة',
  teacherDetail: 'تفاصيل الأستاذ',
  groupDetail: 'تفاصيل الفوج',
  expenses: 'المصاريف الإضافية',
  monthlyReport: 'التقرير الشهري',
  annualReport: 'التقرير السنوي',
  notifications: 'الإشعارات',
  archive: 'الأرشيف'
};

function showView(view, ctx){
  saveState();
  currentView = view;
  navContext = ctx || {};
  document.getElementById('breadcrumb').textContent = breadcrumbs[view] || view;
  const float = document.getElementById('floatBack');
  if(view === 'menu') float.classList.remove('show'); else float.classList.add('show');
  const map = {
    menu: renderMenu,
    addTeacher: renderAddTeacher,
    addGroup: renderAddGroup,
    addStudents: renderAddStudents,
    teachersList: renderTeachersList,
    teacherDetail: renderTeacherDetail,
    groupDetail: renderGroupDetail,
    expenses: renderExpenses,
    monthlyReport: renderMonthlyReport,
    annualReport: renderAnnualReport,
    notifications: renderNotifications,
    archive: renderArchive
  };
  (map[view] || renderMenu)();
  refreshNotifBadge();
  window.scrollTo(0,0);
}
function goHome(){ saveState(); showView('menu'); }

// ---------- Helper finders ----------
function findTeacher(id){ return state.teachers.find(t=>t.id===id); }
function findGroup(teacher, gid){ return teacher.groups.find(g=>g.id===gid); }
function findStudent(group, sid){ return group.students.find(s=>s.id===sid); }

// ---------- Form helpers ----------
function enterToNext(container){
  const inputs = container.querySelectorAll('input:not([type=checkbox]):not([type=button]), select, textarea');
  inputs.forEach((inp,i)=>{
    inp.addEventListener('keydown', e=>{
      if(e.key==='Enter' && !(inp.tagName==='TEXTAREA')){
        e.preventDefault();
        const next = inputs[i+1];
        if(next) next.focus(); else {
          const btn = container.querySelector('.primary-submit');
          if(btn) btn.click();
        }
      }
    });
  });
}

// ---------- Render: Main Menu ----------
function renderMenu(){
  const c = document.getElementById('viewContainer');
  const notifications = getNotifications();
  c.innerHTML = `
    <div class="view-title"><span class="icon">🏫</span> القائمة الرئيسية</div>
    <div class="view-subtitle">مرحباً بك في نظام إدارة مدرسة النخبة العلمية. اختر الإجراء المطلوب.</div>
    <div class="stats-grid">
      <div class="stat-card"><div class="label">عدد الأساتذة</div><div class="value">${fmtNum(state.teachers.length)}</div></div>
      <div class="stat-card success"><div class="label">إجمالي التلاميذ</div><div class="value">${fmtNum(totalStudents())}</div></div>
      <div class="stat-card accent"><div class="label">عدد الأفواج</div><div class="value">${fmtNum(totalGroups())}</div></div>
      <div class="stat-card ${notifications.length?'danger':''}"><div class="label">إشعارات نشطة</div><div class="value">${fmtNum(notifications.length)}</div></div>
    </div>
    <div class="menu-grid">
      <div class="menu-card" onclick="showView('addTeacher')"><div class="icon-circle">👨‍🏫</div><h3>إضافة أستاذ</h3><p>تسجيل أستاذ جديد مع أفواجه وتلاميذه</p></div>
      <div class="menu-card" onclick="showView('teachersList')"><div class="icon-circle">📋</div><h3>قائمة الأساتذة</h3><p>عرض، تعديل، حذف، وحساب الرواتب</p></div>
      <div class="menu-card accent" onclick="showView('expenses')"><div class="icon-circle">💰</div><h3>المصاريف الإضافية</h3><p>الكهرباء، الماء، العتاد وغيرها</p></div>

// ---------- Student receipt / edit / delete ----------
async function promptAddReceipt(tid, gid, sid){
  const teacher = findTeacher(tid); const group = findGroup(teacher, gid); const student = findStudent(group, sid);
  const defaultAmount = group.type==='individual'
    ? Math.round(state.settings.prices.individual / Math.max(1, group.students.length))
    : state.settings.prices[group.type];
  const html = `
    <div class="form-group" style="margin-bottom:10px;"><label>كود الوصل الجديد</label><input id="newReceiptCode" type="text" style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:8px;"></div>
    <div class="form-group" style="margin-bottom:10px;"><label>التاريخ</label><input id="newReceiptDate" type="date" value="${todayStr()}" style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:8px;"></div>
    <div class="form-group"><label>المبلغ (دج)</label><input id="newReceiptAmount" type="number" value="${defaultAmount}" style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:8px;"></div>`;
  const ok = await confirmModal('➕ إضافة وصل جديد - '+student.firstName+' '+student.lastName, html, 'إضافة');
  if(!ok) return;
  const code = document.getElementById('newReceiptCode').value.trim();
  const date = document.getElementById('newReceiptDate').value;
  const amount = parseFloat(document.getElementById('newReceiptAmount').value) || 0;
  if(!code || !date){ toast('أدخل كود الوصل والتاريخ','error'); return; }
  student.receipts.push({ code, date, monthKey: monthKeyFromDate(date), amount });
  saveState();
  toast('تمت إضافة الوصل');
  // refresh current view
  showView(currentView, navContext);
}

async function editStudent(tid, gid, sid){
  const teacher = findTeacher(tid); const group = findGroup(teacher, gid); const student = findStudent(group, sid);
  const html = `
    <div class="form-group" style="margin-bottom:10px;"><label>الاسم</label><input id="es_first" value="${student.firstName}" style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:8px;"></div>
    <div class="form-group" style="margin-bottom:10px;"><label>اللقب</label><input id="es_last" value="${student.lastName}" style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:8px;"></div>
    <div class="form-group"><label>تاريخ التسجيل</label><input id="es_date" type="date" value="${student.registrationDate}" style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:8px;"></div>`;
  const ok = await confirmModal('✎ تعديل التلميذ', html, 'حفظ');
  if(!ok) return;
  student.firstName = document.getElementById('es_first').value.trim() || student.firstName;
  student.lastName = document.getElementById('es_last').value.trim() || student.lastName;
  student.registrationDate = document.getElementById('es_date').value || student.registrationDate;
  saveState(); toast('تم التعديل'); showView(currentView, navContext);
}

async function deleteStudent(tid, gid, sid){
  const ok = await confirmModal('حذف التلميذ', 'هل تريد حذف هذا التلميذ نهائياً؟ لا يمكن التراجع.', 'حذف');
  if(!ok) return;
  const teacher = findTeacher(tid); const group = findGroup(teacher, gid);
  group.students = group.students.filter(s=>s.id!==sid);
  saveState(); toast('تم الحذف'); showView(currentView, navContext);
}

function studentStatus(student, today){
  today = today || new Date();
  let lastDate = student.registrationDate;
  if(student.receipts.length){
    const last = student.receipts[student.receipts.length-1];
    lastDate = last.date;
  }
  const d = new Date(lastDate);
  const diff = daysBetween(d, today);
  // Within 23 days of last payment → green; >=23 (within a week of next due) → red
  if(diff < 23) return { cls:'row-success', badge:'badge-green', label:'مدفوع' };
  if(diff >= 23 && diff <= 45) return { cls:'row-danger', badge:'badge-red', label:'دفع مستحق قريباً' };
  return { cls:'row-danger', badge:'badge-red', label:'متأخر' };
}

// ---------- Salary calculation ----------
function calcSalary(teacher){
  const monthKey = currentMonthKey();
  let grossIncome = 0;
  const breakdown = [];
  teacher.groups.forEach(g=>{
    let groupIncome = 0;
    let paidCount = 0;
    g.students.forEach(s=>{
      const receiptsThisMonth = s.receipts.filter(r=>r.monthKey===monthKey);
      const sum = receiptsThisMonth.reduce((a,r)=>a+(r.amount||0),0);
      if(sum>0) paidCount++;
      groupIncome += sum;
    });
    breakdown.push({
      groupId: g.id,
      type: g.type,
      typeLabel: groupTypeLabel(g.type),
      totalStudents: g.students.length,
      paidStudents: paidCount,
      groupIncome
    });
    grossIncome += groupIncome;
  });
  const teacherShare = grossIncome * state.settings.teacherShare;
  const schoolShare = grossIncome * state.settings.schoolShare;
  const printingCost = teacher.printedPages * state.settings.pagePrice;
  const netSalary = Math.max(0, teacherShare - printingCost);
  return { monthKey, grossIncome, teacherShare, schoolShare, printingCost, netSalary, breakdown, pages: teacher.printedPages };
}

// ---------- Reports ----------
function calcMonthlyReportData(monthKey){
  let totalIncome = 0;
  let totalTeacherSalaries = 0;
  let totalPrintingDeducted = 0;
  let totalSchoolFromTeachers = 0;
  const teacherRows = [];
  state.teachers.forEach(t=>{
    const sh = t.salaryHistory.find(h=>h.monthKey===monthKey);
    if(sh){
      totalIncome += sh.grossIncome;
      totalTeacherSalaries += sh.netSalary;
      totalPrintingDeducted += sh.printingCost;
      // School profit from this teacher = school share + printing cost recovered
      const schoolFromTeacher = sh.schoolShare + sh.printingCost;
      totalSchoolFromTeachers += schoolFromTeacher;
      teacherRows.push({
        name: t.firstName+' '+t.lastName,
        subject: t.subject,
        grossIncome: sh.grossIncome,
        teacherShare: sh.teacherShare,
        schoolShare: sh.schoolShare,
        pages: sh.pages,
        printingCost: sh.printingCost,
        netSalary: sh.netSalary,
        schoolProfit: schoolFromTeacher
      });
    }
  });
  const monthExpenses = state.expenses.filter(e=>monthKeyFromDate(e.date)===monthKey);
  const totalExpenses = monthExpenses.reduce((s,e)=>s+e.amount,0);
  const netProfit = totalSchoolFromTeachers - totalExpenses;
  return {
    monthKey, totalIncome, totalTeacherSalaries, totalPrintingDeducted,
    totalSchoolFromTeachers, totalExpenses, netProfit, teacherRows, expenses: monthExpenses
  };
}

function allTeachersHavePaidThisMonth(){
  const mk = currentMonthKey();
  if(state.teachers.length===0) return false;
  return state.teachers.every(t => t.salaryHistory.some(h=>h.monthKey===mk));
}

// ---------- End school year ----------
async function endSchoolYear(){
  if(state.teachers.length===0){
    toast('لا يوجد أساتذة لأرشفتهم','warning'); return;
  }
  const ok1 = await confirmModal('⚠️ إنهاء السنة الدراسية',
    `سيتم القيام بما يلي:<br><br>
    ✓ إنشاء تقرير سنوي نهائي<br>
    ✓ حفظ نسخة احتياطية كاملة في الأرشيف<br>
    ✓ <strong style="color:var(--danger);">حذف كل الأفواج والتلاميذ</strong> (يبقى الأساتذة فقط)<br>
    ✓ تصفير عدادات الطباعة<br>
    ✓ إعادة ضبط تاريخ بداية السنة الدراسية الجديدة<br><br>
    <strong>هل أنت متأكد؟ لا يمكن التراجع.</strong>`, 'نعم، إنهاء السنة');
  if(!ok1) return;

  // build annual report data
  const reports = state.monthlyReports.slice();
  let totalIncome=0, totalSalaries=0, totalExpenses=0, totalSchool=0;
  reports.forEach(r=>{
    totalIncome += r.data.totalIncome;
    totalSalaries += r.data.totalTeacherSalaries;
    totalExpenses += r.data.totalExpenses;
    totalSchool += r.data.totalSchoolFromTeachers;
  });
  const netProfit = totalSchool - totalExpenses;
  const yearLabel = state.schoolYearStart + ' → ' + todayStr();
  const annualData = {
    totalIncome, totalTeacherSalaries: totalSalaries,
    totalExpenses, totalSchoolFromTeachers: totalSchool, netProfit,
    monthlyReports: reports
  };
  state.annualReports.push({
    label: yearLabel,
    data: annualData,
    archivedAt: todayStr(),
    snapshot: JSON.parse(JSON.stringify({ teachers: state.teachers, expenses: state.expenses }))
  });
  // archive (full)
  state.archive.push({
    label: yearLabel,
    archivedAt: todayStr(),
    data: JSON.parse(JSON.stringify(state))
  });
  // reset
  state.teachers.forEach(t=>{
    t.groups = [];
    t.printedPages = 0;
    t.salaryHistory = [];
  });
  state.expenses = [];
  state.monthlyReports = [];
  state.schoolYearStart = todayStr();
  saveState();
  toast('تم إنهاء السنة الدراسية وحفظ الأرشيف');
  showView('annualReport');
}

// ---------- Notifications ----------
function getNotifications(){
  const today = new Date();
  const result = [];
  state.teachers.forEach(t=>{
    t.groups.forEach(g=>{
      g.students.forEach(s=>{
        const st = studentStatus(s, today);
        if(st.label !== 'مدفوع'){
          let lastDate = s.registrationDate;
          if(s.receipts.length) lastDate = s.receipts[s.receipts.length-1].date;
          const diff = daysBetween(new Date(lastDate), today);
          result.push({
            teacherName: t.firstName+' '+t.lastName,
            teacherId: t.id,
            groupId: g.id,
            studentId: s.id,
            studentName: s.firstName+' '+s.lastName,
            groupType: groupTypeLabel(g.type),
            lastDate, daysSince: diff,
            status: st.label
          });
        }
      });
    });
  });
  result.sort((a,b)=>b.daysSince - a.daysSince);
  return result;
}

// ---------- Excel Exports ----------
function downloadJSON(filename, obj){
  const blob = new Blob([JSON.stringify(obj,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

    ['التقرير السنوي - مدرسة النخبة العلمية'],
    ['بداية السنة', state.schoolYearStart],
    ['تاريخ الإنشاء', todayStr()],
    [],
    ['إجمالي المداخيل', totalIncome],
    ['إجمالي رواتب الأساتذة', totalSalaries],
    ['إجمالي المصاريف', totalExpenses],
    ['صافي ربح المدرسة', netProfit]
  ];
  const ws1 = XLSX.utils.aoa_to_sheet(summary);
  ws1['!cols']=[{wch:30},{wch:20}];
  XLSX.utils.book_append_sheet(wb, ws1, 'الملخص السنوي');

  const monthly = [['الشهر','المداخيل','رواتب','مصاريف','صافي ربح']];
  state.monthlyReports.forEach(r=>monthly.push([arabicMonthName(r.monthKey), r.data.totalIncome, r.data.totalTeacherSalaries, r.data.totalExpenses, r.data.netProfit]));
  const ws2 = XLSX.utils.aoa_to_sheet(monthly);
  ws2['!cols']=monthly[0].map(()=>({wch:18}));
  XLSX.utils.book_append_sheet(wb, ws2, 'التقارير الشهرية');
  XLSX.writeFile(wb, `التقرير_السنوي_${todayStr()}.xlsx`);
  toast('تم تصدير التقرير السنوي');
}

// ---------- Backup ----------
function backupExport(){
  downloadJSON('نسخة_احتياطية_مدرسة_النخبة_'+todayStr()+'.json', state);
  toast('تم تحميل النسخة الاحتياطية');
}
async function backupImport(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const ok = await confirmModal('استعادة من نسخة احتياطية','سيتم استبدال كل البيانات الحالية. هل تريد المتابعة؟','استعادة');
  if(!ok){ ev.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const data = JSON.parse(e.target.result);
      state = Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), data);
      saveState();
      toast('تم استرجاع البيانات');
      showView('menu');
    }catch(err){
      toast('ملف غير صالح','error');
    }
  };
  reader.readAsText(file);
}

// ---------- Init ----------
showView('menu');
