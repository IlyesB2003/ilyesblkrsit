name: Windows installer test

on:
  push:
    branches: [windows-installer-test]
    paths-ignore: ['ci-results/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer-test
  cancel-in-progress: true

jobs:
  static:
    name: Static checks + Setup.exe opens
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Parse script, check winget IDs, run Setup.exe
        shell: powershell
        run: ./ci/static-checks.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-static, path: results/ }
      - name: Save results to branch
        if: always()
        shell: bash
        run: |
          mkdir -p ci-results && cp -r results/* ci-results/ 2>/dev/null || true
          git config user.name "installer-test-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ci-results
          git commit -m "Windows test results: static (run ${GITHUB_RUN_NUMBER}) [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin windows-installer-test && git push origin HEAD:windows-installer-test && break; sleep $((i*7)); done

  install:
    name: Install - ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: wizard-flow
            components: "sqlite,lua"
    steps:
      - uses: actions/checkout@v4
      - name: Run Setup.exe and click through the wizard
        shell: powershell
        run: ./ci/run-part.ps1 -Name "${{ matrix.name }}" -Components "${{ matrix.components }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "results-${{ matrix.name }}", path: results/ }
      - name: Save results to branch
        if: always()
        shell: bash
        run: |
          mkdir -p ci-results && cp -r results/* ci-results/ 2>/dev/null || true
          git config user.name "installer-test-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ci-results
          git commit -m "Windows test results: ${{ matrix.name }} (run ${GITHUB_RUN_NUMBER}) [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin windows-installer-test && git push origin HEAD:windows-installer-test && break; sleep $((i*7)); done
